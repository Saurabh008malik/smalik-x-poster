<!doctype html><html><head><meta charset=utf-8>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@500;700;800&display=swap" rel=stylesheet>
<style>
*{box-sizing:border-box}body{margin:0;width:1600px;height:900px;background:linear-gradient(115deg,#14030A 0%,#3A0914 55%,#5A0F1C 100%);font-family:Mukta,sans-serif;color:#fff;overflow:hidden;position:relative}
.strip{position:absolute;left:0;right:0;height:40px;background:#0A0205;display:flex;gap:30px;padding-left:16px;align-items:center}
.strip i{display:block;width:30px;height:20px;background:#F6C445;opacity:.8;border-radius:4px}
.glow{position:absolute;right:-200px;top:-200px;width:900px;height:900px;background:radial-gradient(circle,rgba(246,196,69,.16),transparent 65%)}
.top{position:absolute;left:80px;top:84px;display:flex;align-items:center;gap:20px}
.tag{background:#F6C445;color:#2A050C;font-weight:800;font-size:34px;padding:4px 26px;border-radius:10px}
.date{color:#E8CFB8;font-size:30px;font-weight:500}
h1{position:absolute;left:80px;right:80px;top:170px;margin:0;font-weight:800;font-size:96px;line-height:1.12;color:#fff}
h1 em{font-style:normal;color:#F6C445}
.sub{position:absolute;left:80px;right:120px;top:var(--subtop);font-size:40px;line-height:1.35;color:#F3E6D6;font-weight:500}
.stats{position:absolute;left:80px;right:80px;bottom:128px;display:flex;gap:26px}
.s{flex:1;background:rgba(0,0,0,.28);border:2px solid rgba(246,196,69,.35);border-radius:22px;padding:20px 28px}
.s b{display:block;font-size:54px;font-weight:800;color:#F6C445;line-height:1.15}
.s span{display:block;font-size:30px;color:#F3E6D6;line-height:1.3}
.foot{position:absolute;left:80px;right:80px;bottom:56px;display:flex;justify-content:space-between;align-items:center;font-size:26px;color:#D9B9A0}
.brand{font-weight:800;font-size:36px;color:#F6C445}
</style></head><body><div class=glow></div><div class=strip style="top:0"></div><div class=strip style="bottom:0"></div>
<div class=top><div class=tag id=tag></div><div class=date id=date></div></div>
<h1 id=h></h1><div class=sub id=sub></div><div class=stats id=stats></div>
<div class=foot><div id=src></div><div class=brand>🎬 बॉलीवुड की बात</div></div>
<script>
document.querySelectorAll('.strip').forEach(s=>{for(let i=0;i<30;i++)s.appendChild(document.createElement('i'))});
const D=window.DATA;tag.textContent=D.tag||'ख़बर';date.textContent=D.date||'';h.innerHTML=D.headline||'';sub.textContent=D.sub||'';src.textContent=D.source?('स्रोत: '+D.source):'';
document.body.style.setProperty('--subtop',(180+h.getBoundingClientRect().height+22)+'px');
(D.stats||[]).slice(0,3).forEach(x=>{const d=document.createElement('div');d.className='s';d.innerHTML='<b></b><span></span>';d.querySelector('b').textContent=x.big;d.querySelector('span').textContent=x.small;stats.appendChild(d)});
if(!(D.stats||[]).length)stats.remove();
</script></body></html>
