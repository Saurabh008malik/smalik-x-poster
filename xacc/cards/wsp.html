<!doctype html><html><head><meta charset=utf-8>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600;800&display=swap" rel=stylesheet>
<style>
*{box-sizing:border-box}body{margin:0;width:1600px;height:900px;background:linear-gradient(125deg,#070A0E 0%,#0B1219 60%,#0A1A14 100%);font-family:Inter,sans-serif;color:#fff;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px}
.top{position:absolute;left:80px;top:64px;right:80px;display:flex;align-items:center;gap:20px}
.tag{background:var(--a);color:#06110C;font-family:'Space Grotesk';font-weight:700;font-size:30px;padding:10px 26px;border-radius:10px;letter-spacing:1px;text-transform:uppercase}
.date{color:#9FB0C2;font-size:28px;font-weight:600;letter-spacing:1px}
h1{position:absolute;left:80px;right:80px;top:160px;margin:0;font-family:'Space Grotesk';font-weight:700;font-size:92px;line-height:1.04;letter-spacing:-2px}
h1 em{font-style:normal;color:var(--a)}
.sub{position:absolute;left:80px;right:120px;top:var(--subtop);font-size:36px;line-height:1.35;color:#C9D4DF;font-weight:600}
.stats{position:absolute;left:80px;right:80px;bottom:120px;display:flex;gap:26px}
.s{flex:1;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.09);border-radius:22px;padding:26px 30px}
.s b{display:block;font-family:'Space Grotesk';font-size:52px;font-weight:700;color:var(--a);line-height:1.1}
.s span{display:block;margin-top:8px;font-size:26px;color:#B7C3CF;line-height:1.3}
.foot{position:absolute;left:80px;right:80px;bottom:40px;display:flex;justify-content:space-between;align-items:center;font-size:24px;color:#7F90A3}
.brand{font-family:'Space Grotesk';font-weight:700;font-size:30px;color:#fff;display:flex;align-items:center;gap:14px}
.brand i{color:#00E08A;font-style:normal}
</style></head><body><div class=grid></div>
<div class=top><div class=tag id=tag></div><div class=date id=date></div></div>
<h1 id=h></h1><div class=sub id=sub></div>
<div class=stats id=stats></div>
<div class=foot><div id=src></div><div class=brand><svg width=46 height=26><polyline points="0,15 12,15 17,4 23,24 29,9 33,15 46,15" fill=none stroke=#00E08A stroke-width=4 stroke-linejoin=round stroke-linecap=round /></svg>WALL ST <i>PULSE</i></div></div>
<script>
const D=window.DATA;const down=D.direction==='down';const a=down?'#FF4D5E':(D.accent||'#00E08A');document.body.style.setProperty('--a',a);
tag.textContent=D.tag||'Markets';date.textContent=D.date||'';h.innerHTML=D.headline||'';sub.textContent=D.sub||'';src.textContent=D.source?('Source: '+D.source):'';
const lines=Math.ceil(h.getBoundingClientRect().height/96);document.body.style.setProperty('--subtop',(170+h.getBoundingClientRect().height+26)+'px');
(D.stats||[]).slice(0,3).forEach(x=>{const d=document.createElement('div');d.className='s';d.innerHTML='<b></b><span></span>';d.querySelector('b').textContent=x.big;d.querySelector('span').textContent=x.small;stats.appendChild(d)});
if(!(D.stats||[]).length)stats.remove();
</script></body></html>
