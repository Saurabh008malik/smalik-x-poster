<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  body { font-family: "Inter", "Noto Color Emoji", sans-serif; background: #070D1A; color: #F4F6FB; overflow: hidden; }
  .card { position: relative; width: 1080px; height: 1350px; padding: 72px 64px 56px;
    background: radial-gradient(800px 700px at 110% -5%, var(--glow, rgba(255,153,51,.28)), transparent 60%),
      radial-gradient(700px 600px at -10% 105%, rgba(56,110,255,.20), transparent 60%),
      linear-gradient(165deg, #0B1428 0%, #070D1A 72%);
    display: flex; flex-direction: column; }
  .card::before { content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 60px 60px; mask-image: linear-gradient(180deg, transparent, #000 25%, #000 75%, transparent); pointer-events: none; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; position: relative; }
  .pill { font-size: 20px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: #C9D2E6; padding: 12px 20px; border: 1.5px solid rgba(255,255,255,.18); border-radius: 999px; background: rgba(255,255,255,.04); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 20px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #070D1A; background: var(--accent, #FF9933); padding: 12px 20px; border-radius: 999px; white-space: nowrap; }
  h1 { font-family: "Inter Display", "Inter", sans-serif; font-weight: 900; font-size: 116px; line-height: .95; letter-spacing: -.035em; margin-top: 56px; position: relative; }
  h1 em { font-style: normal; color: var(--accent, #FF9933); white-space: nowrap; }
  .teams { margin-top: 52px; display: flex; flex-direction: column; gap: 16px; position: relative; }
  .team { display: grid; grid-template-columns: 12px 1fr auto; align-items: center; gap: 24px; padding: 24px 28px; border-radius: 22px; background: rgba(255,255,255,.045); border: 1.5px solid rgba(255,255,255,.08); }
  .team.win { background: rgba(255,255,255,.09); border-color: var(--accent, #FF9933); }
  .bar { width: 12px; height: 64px; border-radius: 8px; }
  .name { font-size: 40px; font-weight: 800; text-transform: uppercase; letter-spacing: -.01em; }
  .overs { display: block; font-size: 22px; font-weight: 500; color: #8E9AB5; text-transform: none; margin-top: 4px; letter-spacing: 0; }
  .score { font-family: "Inter Display","Inter",sans-serif; font-size: 72px; font-weight: 900; letter-spacing: -.02em; text-align: right; }
  .team.win .score { color: var(--accent, #FF9933); }
  .result { margin-top: 26px; font-size: 30px; font-weight: 700; color: #DCE3F2; position: relative; line-height: 1.3; }
  .stats { margin-top: auto; display: flex; flex-direction: column; gap: 14px; position: relative; }
  .stat { display: grid; grid-template-columns: 230px 1fr; align-items: center; gap: 20px; padding: 20px 26px; border-radius: 18px; background: rgba(255,255,255,.05); border: 1.5px solid rgba(255,255,255,.08); }
  .stat b { font-family: "Inter Display","Inter",sans-serif; font-size: 40px; font-weight: 900; letter-spacing: -.02em; color: #fff; }
  .stat span { font-size: 23px; font-weight: 500; color: #A9B4CC; line-height: 1.3; }
  .foot { margin-top: 28px; display: flex; justify-content: space-between; align-items: center; position: relative; font-size: 20px; font-weight: 600; color: #8E9AB5; }
  .brand { display: flex; align-items: center; gap: 14px; color: #F4F6FB; font-weight: 800; font-size: 26px; }
  .brand svg { width: 52px; height: 52px; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="top"><div class="pill" id="pill"></div><div class="tag" id="tag"></div></div>
  <h1 id="headline"></h1>
  <div class="teams" id="teams"></div>
  <div class="result" id="result"></div>
  <div class="stats" id="stats"></div>
  <div class="foot">
    <div class="brand">
      <svg viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB25E"/><stop offset="1" stop-color="#FF8A1F"/></linearGradient></defs>
        <path d="M38 22 h124 a28 28 0 0 1 28 28 v84 a28 28 0 0 1 -28 28 h-74 l-34 28 v-28 h-16 a28 28 0 0 1 -28 -28 v-84 a28 28 0 0 1 28 -28 z" fill="url(#g)"/>
        <circle cx="100" cy="92" r="50" fill="#0F1A33"/>
        <path d="M94 43 V141 M106 43 V141" stroke="#F4F6FB" stroke-width="5" stroke-linecap="round"/></svg>
      Cricket Ki Baat
    </div>
    <div id="source"></div>
  </div>
</div>
<script>
  const D = window.DATA;
  const card = document.getElementById('card');
  if (D.accent) card.style.setProperty('--accent', D.accent);
  if (D.glow) card.style.setProperty('--glow', D.glow);
  document.getElementById('pill').textContent = D.pill;
  document.getElementById('tag').textContent = D.tag;
  document.getElementById('headline').innerHTML = D.headline;
  document.getElementById('teams').innerHTML = D.teams.map(t => `
    <div class="team ${t.win ? 'win' : ''}"><div class="bar" style="background:${t.color}"></div>
      <div class="name">${t.name}<span class="overs">${t.overs || ''}</span></div><div class="score">${t.score}</div></div>`).join('');
  document.getElementById('result').textContent = D.result;
  document.getElementById('stats').innerHTML = D.stats.map(s => `<div class="stat"><b>${s.big}</b><span>${s.small}</span></div>`).join('');
  document.getElementById('source').textContent = D.source || '';
</script>
</body>
</html>
