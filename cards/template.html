<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1600px; height: 900px; }
  body {
    font-family: "Inter", "Noto Color Emoji", sans-serif;
    background: #070D1A;
    color: #F4F6FB;
    overflow: hidden;
  }
  .card {
    position: relative; width: 1600px; height: 900px;
    padding: 64px 80px 56px;
    background:
      radial-gradient(900px 600px at 105% -10%, var(--glow, rgba(255,190,41,.28)), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(56,110,255,.20), transparent 60%),
      linear-gradient(160deg, #0B1428 0%, #070D1A 70%);
    display: flex; flex-direction: column;
  }
  .card::before {
    content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: linear-gradient(180deg, transparent, #000 30%, #000 70%, transparent);
    pointer-events: none;
  }
  .top { display: flex; justify-content: space-between; align-items: center; position: relative; }
  .pill {
    font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: #C9D2E6; padding: 12px 22px; border: 1.5px solid rgba(255,255,255,.18);
    border-radius: 999px; background: rgba(255,255,255,.04);
  }
  .tag {
    font-size: 22px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    color: #070D1A; background: var(--accent, #FFBE29); padding: 12px 22px; border-radius: 999px;
  }
  h1 {
    font-family: "Inter Display", "Inter", sans-serif;
    font-weight: 900; font-size: 112px; line-height: .95; letter-spacing: -.035em;
    margin-top: 40px; position: relative;
  }
  h1 em { font-style: normal; color: var(--accent, #FFBE29); }
  .teams { margin-top: 40px; display: flex; flex-direction: column; gap: 16px; position: relative; }
  .team {
    display: grid; grid-template-columns: 14px 1fr auto auto; align-items: center; gap: 28px;
    padding: 22px 32px; border-radius: 22px;
    background: rgba(255,255,255,.045); border: 1.5px solid rgba(255,255,255,.08);
  }
  .team.win { background: rgba(255,255,255,.09); border-color: var(--accent, #FFBE29); }
  .bar { width: 14px; height: 56px; border-radius: 8px; }
  .name { font-size: 44px; font-weight: 800; letter-spacing: -.01em; text-transform: uppercase; }
  .overs { font-size: 26px; font-weight: 500; color: #8E9AB5; }
  .score { font-family: "Inter Display","Inter",sans-serif; font-size: 64px; font-weight: 900; letter-spacing: -.02em; min-width: 230px; text-align: right; }
  .team.win .score { color: var(--accent, #FFBE29); }
  .result { margin-top: 22px; font-size: 30px; font-weight: 700; color: #DCE3F2; position: relative; }
  .stats { margin-top: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; position: relative; }
  .stat { padding: 20px 24px; border-radius: 18px; background: rgba(255,255,255,.05); border: 1.5px solid rgba(255,255,255,.08); }
  .stat b { display: block; font-family: "Inter Display","Inter",sans-serif; font-size: 40px; font-weight: 900; letter-spacing: -.02em; color: #fff; }
  .stat span { display: block; margin-top: 4px; font-size: 21px; font-weight: 500; color: #A9B4CC; line-height: 1.3; }
  .foot { margin-top: 26px; display: flex; justify-content: space-between; align-items: center; position: relative; font-size: 22px; font-weight: 600; color: #8E9AB5; }
  .foot .handle { color: #F4F6FB; font-weight: 800; font-size: 24px; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="top">
    <div class="pill" id="pill"></div>
    <div class="tag" id="tag"></div>
  </div>
  <h1 id="headline"></h1>
  <div class="teams" id="teams"></div>
  <div class="result" id="result"></div>
  <div class="stats" id="stats"></div>
  <div class="foot">
    <div class="handle">Saurabh Malik 🏏 &nbsp;@Smalik_wc</div>
    <div id="source"></div>
  </div>
</div>
<script>
  const D = window.DATA;
  const card = document.getElementById('card');
  if (D.accent) card.style.setProperty('--accent', D.accent);
  if (D.glow) card.style.setProperty('--glow', D.glow);
  document.getElementById('pill').textContent = D.pill;
  document.getElementById('tag').textContent = D.tag;
  document.getElementById('headline').innerHTML = D.headline;
  document.getElementById('teams').innerHTML = D.teams.map(t => `
    <div class="team ${t.win ? 'win' : ''}">
      <div class="bar" style="background:${t.color}"></div>
      <div class="name">${t.name}</div>
      <div class="overs">${t.overs || ''}</div>
      <div class="score">${t.score}</div>
    </div>`).join('');
  document.getElementById('result').textContent = D.result;
  document.getElementById('stats').innerHTML = D.stats.map(s => `
    <div class="stat"><b>${s.big}</b><span>${s.small}</span></div>`).join('');
  document.getElementById('source').textContent = D.source || '';
</script>
</body>
</html>
