<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /*FONTS*/
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; }
  body { font-family: "Mukta", "Noto Color Emoji", sans-serif; overflow: hidden; background: #17130F; color: #17130F; }
  .seg { position: absolute; inset: 0; overflow: hidden; opacity: 0; will-change: transform, opacity; }
  .rays { position: absolute; left: 50%; top: 42%; width: 3400px; height: 3400px; margin: -1700px; border-radius: 50%;
    background: repeating-conic-gradient(var(--ray) 0 7deg, transparent 7deg 14deg); }
  /* brand chip + progress */
  #bar { position: absolute; left: 0; top: 0; height: 12px; width: 0; background: #E23D47; z-index: 20; }
  #brand { position: absolute; left: 54px; top: 96px; z-index: 19; display: flex; align-items: center; gap: 14px;
    background: rgba(255,255,255,.92); border-radius: 999px; padding: 8px 26px 8px 8px; font: 800 32px "Bricolage", sans-serif; color: #17130F; }
  #brand img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 3px solid #17130F; }
  /* captions */
  #cap { position: absolute; left: 60px; right: 60px; top: 1250px; z-index: 18; text-align: center; }
  #cap span { display: inline; background: #17130F; color: #fff; font: 700 70px/1.32 "Mukta", "Noto Color Emoji", sans-serif;
    padding: 4px 24px; border-radius: 18px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  #cap em { font-style: normal; color: #FFD43B; }
  #cap.inv span { background: #FFD43B; color: #17130F; }
  #cap.inv em { color: #E23D47; }
  .step .host { position: absolute; left: 60px; top: 1440px; width: 250px; height: 250px; border-radius: 50%; object-fit: cover; border: 8px solid var(--ink); box-shadow: 8px 10px 0 var(--ink); }
  .step .say { position: absolute; left: 300px; top: 1470px; background: var(--card); color: var(--ink); border: 5px solid var(--ink); border-radius: 30px 30px 30px 6px; padding: 14px 26px; font: 800 40px "Bricolage", sans-serif; }
  /* hook */
  .hook { background: #F6E7C8; }
  .hook .art { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; transform-origin: 50% 45%; }
  .hook .shade { position: absolute; inset: 0; background: linear-gradient(rgba(0,0,0,.0) 50%, rgba(0,0,0,.35)); }
  .hook .head { position: absolute; left: 54px; right: 54px; top: 210px; background: #FFFDF7; border: 7px solid #17130F; border-radius: 40px;
    box-shadow: 12px 14px 0 #17130F; padding: 26px 36px 32px; font: 800 104px/1.02 "Bricolage", sans-serif; letter-spacing: -.03em; }
  .hook .head em, .step h2 em { font-style: normal; color: #fff; background: #E23D47; padding: 0 .14em; border-radius: .12em;
    -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .sticker { position: absolute; right: 70px; top: 150px; z-index: 3; background: #E23D47; color: #fff; font: 800 64px/1 "Bricolage", sans-serif;
    padding: 20px 30px; border-radius: 22px; box-shadow: 0 10px 0 #17130F; white-space: nowrap; }
  /* step */
  .step .kick { position: absolute; left: 54px; top: 210px; font: 800 34px "Bricolage", sans-serif; letter-spacing: .1em; text-transform: uppercase;
    padding: 14px 30px; border-radius: 999px; background: var(--ink); color: var(--bg); }
  .step .num { position: absolute; left: 54px; top: 330px; width: 230px; height: 230px; border-radius: 50%; background: #E23D47; color: #fff;
    display: grid; place-items: center; font: 800 150px/1 "Bricolage", sans-serif; border: 8px solid var(--ink); box-shadow: 10px 12px 0 var(--ink); }
  .step .icon { position: absolute; right: 70px; top: 300px; font-size: 230px; line-height: 1; }
  .step h2 { position: absolute; left: 54px; right: 54px; top: 640px; background: var(--card); color: var(--ink); border: 7px solid var(--ink);
    border-radius: 40px; box-shadow: 12px 14px 0 var(--ink); padding: 30px 40px 36px; font: 800 112px/1.03 "Bricolage", sans-serif; letter-spacing: -.03em; }
  .step .note { position: absolute; left: 70px; right: 70px; top: 1120px; font: 700 50px/1.25 "Mukta", "Noto Color Emoji", sans-serif; color: var(--sub); text-align: left; }
  /* end */
  .end { background: #17130F; color: #FFFDF7; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 80px 300px; }
  .end img { width: 340px; height: 340px; border-radius: 50%; border: 12px solid #FFD43B; object-fit: cover; }
  .end h2 { font: 800 100px/1.02 "Bricolage", sans-serif; margin-top: 50px; letter-spacing: -.02em; }
  .end h2 span { color: #FFD43B; }
  .end p { font: 500 50px "Mukta", "Noto Color Emoji", sans-serif; color: #D9D2C6; margin-top: 30px; }
  .end .promo { margin-top: 50px; font: 800 42px "Bricolage", sans-serif; background: #FFD43B; color: #17130F; padding: 24px 40px; border-radius: 999px; white-space: nowrap; }
</style>
</head>
<body>
<div id="bar"></div>
<div id="brand"><img src="HOST_SRC" alt="">CREATOR ADDA</div>
<div id="stage"></div>
<div id="cap"></div>
<script>
  const D = window.DATA;
  const THEMES = {
    yellow: { bg: '#FFD43B', ink: '#17130F', card: '#FFFDF7', sub: '#3B2F12', ray: 'rgba(255,255,255,.24)' },
    dark:   { bg: '#17130F', ink: '#FFFDF7', card: '#2A241D', sub: '#D9D2C6', ray: 'rgba(255,212,59,.07)' },
    white:  { bg: '#FFFDF7', ink: '#17130F', card: '#FFF3C4', sub: '#3B342D', ray: 'rgba(255,212,59,.28)' },
    red:    { bg: '#E23D47', ink: '#17130F', card: '#FFFDF7', sub: '#FFFDF7', ray: 'rgba(255,255,255,.16)' }
  };
  const stage = document.getElementById('stage');
  const esc = s => String(s || '');
  D.segs.forEach((s, i) => {
    const el = document.createElement('div'); el.className = 'seg ' + s.kind; el.id = 'seg' + i;
    if (s.kind === 'hook') {
      el.innerHTML = (s.art ? '<img class="art" src="ART_SRC">' : '<div class="rays" style="--ray:rgba(255,255,255,.24)"></div><img class="art" src="HOST_SRC" style="width:900px;height:900px;left:90px;top:700px;border-radius:50%;border:14px solid #17130F">')
        + '<div class="shade"></div><div class="head">' + esc(s.headline) + '</div>' + (s.sticker ? '<div class="sticker">' + esc(s.sticker) + '</div>' : '');
      if (!s.art) el.style.background = '#FFD43B';
    } else if (s.kind === 'step') {
      const t = THEMES[s.theme] || THEMES.yellow;
      Object.entries({ '--bg': t.bg, '--ink': t.ink, '--card': t.card, '--sub': t.sub, '--ray': t.ray }).forEach(([k, v]) => el.style.setProperty(k, v));
      el.style.background = t.bg;
      el.innerHTML = '<div class="rays"></div>' + (s.kicker ? '<div class="kick">' + esc(s.kicker) + '</div>' : '')
        + (s.n ? '<div class="num">' + s.n + '</div>' : '') + (s.icon ? '<div class="icon">' + esc(s.icon) + '</div>' : '')
        + '<h2>' + esc(s.title) + '</h2>' + (s.note ? '<div class="note">' + esc(s.note) + '</div>' : '')
        + '<img class="host" src="HOST_SRC" alt=""><div class="say">' + (s.n ? 'Tip ' + s.n : 'Dhyan do 👀') + '</div>';
    } else {
      el.innerHTML = '<img src="HOST_SRC" alt=""><h2>' + esc(s.title || 'Aise tips <span>roz</span> chahiye?') + '</h2><p>Follow karo @real_creator_adda 🔔</p>'
        + (s.promo ? '<div class="promo">Poori YouTube Kit ₹99 · link bio mein</div>' : '');
    }
    stage.appendChild(el);
    // shrink step titles / hook headline that are too tall
    const h = el.querySelector('h2, .head');
    if (h && s.kind !== 'end') {
      let size = parseInt(getComputedStyle(h).fontSize); const max = s.kind === 'hook' ? 520 : 470;
      el.style.opacity = 1;
      while ((h.scrollHeight > max || h.scrollWidth > h.clientWidth + 1) && size > 54) { size -= 4; h.style.fontSize = size + 'px'; }
      el.style.opacity = 0;
    }
  });
  const segEls = D.segs.map((_, i) => document.getElementById('seg' + i));
  const cl = x => Math.max(0, Math.min(1, x)), ease = x => 1 - Math.pow(1 - x, 3), back = x => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  window.__duration = D.total;
  window.setT = function (t) {
    document.getElementById('bar').style.width = (cl(t / D.total) * 100) + '%';
    D.segs.forEach((s, i) => {
      const el = segEls[i]; const lt = t - s.t0; const d = s.t1 - s.t0;
      const on = t >= s.t0 && (t < s.t1 || i === D.segs.length - 1);
      const nextIn = i < D.segs.length - 1 && t >= D.segs[i + 1].t0 && t < D.segs[i + 1].t0 + 0.24;
      if (!on && !nextIn) { el.style.opacity = 0; return; }
      el.style.opacity = 1; el.style.zIndex = on ? 2 : 1;
      if (on && i > 0) { const p = ease(cl(lt / 0.24)); el.style.transform = `translateX(${(1 - p) * 1080}px) rotate(${(1 - p) * 4}deg)`; }
      else if (nextIn) { const p = ease(cl((t - D.segs[i + 1].t0) / 0.24)); el.style.transform = `translateX(${-p * 300}px) scale(${1 - 0.06 * p})`; }
      else el.style.transform = 'none';
      if (!on) return;
      const rays = el.querySelector('.rays'); if (rays) rays.style.transform = `rotate(${t * 6}deg)`;
      if (s.kind === 'hook') {
        const art = el.querySelector('.art'); const punch = 1 + 0.08 * Math.max(0, 1 - lt / 0.3);
        if (art && s.art) art.style.transform = `scale(${(1.02 + 0.10 * cl(lt / d)) * punch})`;
        const hd = el.querySelector('.head'); const p = back(cl(lt / 0.35)); hd.style.transform = `translateY(${(1 - cl(lt / 0.35)) * -80}px) scale(${0.85 + 0.15 * p})`;
        const st = el.querySelector('.sticker'); if (st) { const q = back(cl((lt - 0.45) / 0.3)); st.style.opacity = cl((lt - 0.45) / 0.1); st.style.transform = `rotate(${-6 + 3 * Math.sin(lt * 5)}deg) scale(${0.4 + 0.6 * q})`; }
      } else if (s.kind === 'step') {
        const n = el.querySelector('.num'); if (n) { const q = back(cl((lt - 0.12) / 0.35)); n.style.transform = `scale(${q})`; }
        const ic = el.querySelector('.icon'); if (ic) { const q = back(cl((lt - 0.3) / 0.35)); ic.style.transform = `translateY(${Math.sin(lt * 3) * 14}px) rotate(${Math.sin(lt * 2) * 6}deg) scale(${q})`; }
        const h = el.querySelector('h2'); const q = ease(cl((lt - 0.18) / 0.35)); h.style.opacity = q; h.style.transform = `translateY(${(1 - q) * 120}px)`;
        const ho = el.querySelector('.host'); if (ho) ho.style.transform = `translateY(${-Math.abs(Math.sin(lt * 7)) * 10}px)`;
        const sy = el.querySelector('.say'); if (sy) { const r = back(cl((lt - 0.4) / 0.3)); sy.style.transform = `scale(${r})`; sy.style.transformOrigin = '0 100%'; }
        const nt = el.querySelector('.note'); if (nt) { const r = ease(cl((lt - 0.6) / 0.4)); nt.style.opacity = r; nt.style.transform = `translateY(${(1 - r) * 40}px)`; }
      } else {
        const im = el.querySelector('img'); im.style.transform = `scale(${1 + 0.04 * Math.sin(lt * 4)})`;
        const pr = el.querySelector('.promo'); if (pr) pr.style.transform = `scale(${1 + 0.03 * Math.sin(lt * 6)})`;
      }
    });
    // captions: the chunk being spoken, popping in
    const c = D.caps.find(x => t >= x.t0 && t < x.t1);
    const cur = D.segs.find(x => t >= x.t0 && t < x.t1);
    document.getElementById('cap').className = (cur && cur.kind === 'step' && cur.theme === 'dark') ? 'inv' : '';
    const cap = document.getElementById('cap');
    const endSeg = D.segs[D.segs.length - 1];
    if (c && !(endSeg.kind === 'end' && t >= endSeg.t0)) {
      if (cap.dataset.k !== String(c.t0)) { cap.dataset.k = String(c.t0); cap.innerHTML = '<span>' + c.html + '</span>'; }
      const p = back(cl((t - c.t0) / 0.16)); cap.style.transform = `scale(${0.8 + 0.2 * p})`; cap.style.opacity = 1;
    } else cap.style.opacity = 0;
    document.getElementById('brand').style.opacity = (endSeg.kind === 'end' && t >= endSeg.t0) ? 0 : 1;
  };
  window.setT(0);
</script>
</body>
</html>
