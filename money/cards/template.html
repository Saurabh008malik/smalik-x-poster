<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; }
  body { font-family: "Inter", "Noto Color Emoji", sans-serif; background: #070B14; color: #F5F7FB; overflow: hidden; }
  .card { position: relative; width: 1080px; height: 1350px; padding: 84px 76px 64px; display: flex; flex-direction: column;
    background: radial-gradient(900px 800px at 100% 0%, var(--glow, rgba(25,208,138,.26)), transparent 62%),
      radial-gradient(700px 600px at 0% 100%, rgba(76,141,255,.14), transparent 60%),
      linear-gradient(170deg, #0C1426 0%, #070B14 75%); }
  .card::before { content: ""; position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size: 60px 60px; mask-image: linear-gradient(180deg, transparent, #000 25%, #000 75%, transparent); pointer-events: none; }
  .kicker { position: relative; align-self: flex-start; font-size: 26px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase;
    color: #061018; background: var(--accent, #19D08A); padding: 14px 26px; border-radius: 999px; }
  .main { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; padding: 30px 0; }
  h1 { font-family: "Inter Display", "Inter", sans-serif; font-weight: 900; line-height: 1.04; letter-spacing: -.035em; font-size: 150px; }
  h1 em { font-style: normal; color: var(--accent, #19D08A); }
  .sub { margin-top: 34px; font-size: 38px; font-weight: 600; line-height: 1.3; color: #C3CCE0; }
  .src { position: relative; font-size: 22px; font-weight: 600; color: #7F8BA6; margin-bottom: 18px; min-height: 26px; }
  .foot { position: relative; display: flex; justify-content: space-between; align-items: center; border-top: 2px solid rgba(255,255,255,.1); padding-top: 28px; }
  .brand { display: flex; align-items: center; gap: 16px; font-weight: 900; font-size: 32px; letter-spacing: -.01em; }
  .brand svg { width: 60px; height: 60px; }
  .cta { font-size: 24px; font-weight: 700; color: #9AA6C0; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="kicker" id="kicker"></div>
  <div class="main" id="m"><h1 id="h"></h1><div class="sub" id="sub"></div></div>
  <div class="src" id="src"></div>
  <div class="foot">
    <div class="brand">
      <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--accent,#19D08A)" stroke-width="8"/><path d="M34 62 L52 80 L88 40" fill="none" stroke="#F5F7FB" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Paycheck Truths
    </div>
    <div class="cta">Follow for daily money truths</div>
  </div>
</div>
<script>
  const D = window.DATA;
  const THEMES = { green: ['#19D08A', 'rgba(25,208,138,.26)'], gold: ['#FFC23D', 'rgba(255,194,61,.26)'], red: ['#FF5A5F', 'rgba(255,90,95,.26)'], blue: ['#4C8DFF', 'rgba(76,141,255,.28)'] };
  const t = THEMES[D.theme] || THEMES.green;
  const card = document.getElementById('card');
  card.style.setProperty('--accent', t[0]); card.style.setProperty('--glow', t[1]);
  document.getElementById('kicker').textContent = D.kicker || 'Money truth';
  const h = document.getElementById('h'); h.innerHTML = D.headline;
  const sub = document.getElementById('sub'); if (D.sub) sub.textContent = D.sub; else sub.remove();
  document.getElementById('src').textContent = D.source || '';
  const m = document.getElementById('m');
  let size = 150;
  while ((m.scrollHeight > m.clientHeight + 1 || h.scrollWidth > h.clientWidth + 1) && size > 40) { size -= 4; h.style.fontSize = size + 'px'; }
  window.__fit = size;
</script>
</body>
</html>
