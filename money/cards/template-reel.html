<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; }
  body { font-family: "Inter", "Noto Color Emoji", sans-serif; background: #070B14; color: #F5F7FB; overflow: hidden; }
  .card { position: relative; width: 1080px; height: 1920px; padding: 230px 80px 0; display: flex; flex-direction: column; background: #070B14; }
  .bg { position: absolute; inset: 0; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px); background-size: 60px 60px; }
  .kicker { position: relative; align-self: flex-start; font-size: 30px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #061018; background: var(--accent); padding: 16px 30px; border-radius: 999px; opacity: 0; }
  .main { position: relative; height: 900px; margin-top: 40px; display: flex; flex-direction: column; justify-content: center; }
  h1 { font-family: "Inter Display", "Inter", sans-serif; font-weight: 900; line-height: 1.05; letter-spacing: -.035em; font-size: 150px; }
  h1 .w { display: inline-block; margin-right: .2em; opacity: 0; }
  h1 .w.em { color: var(--accent); }
  .sub { margin-top: 40px; font-size: 44px; font-weight: 600; line-height: 1.3; color: #C3CCE0; opacity: 0; }
  .src { margin-top: 22px; font-size: 24px; font-weight: 600; color: #7F8BA6; opacity: 0; }
  .brand { position: absolute; left: 80px; right: 80px; top: 1420px; display: flex; align-items: center; gap: 18px; font-weight: 900; font-size: 36px; opacity: 0; }
  .brand svg { width: 68px; height: 68px; }
  .bar { position: absolute; left: 80px; right: 80px; top: 1530px; height: 8px; border-radius: 8px; background: rgba(255,255,255,.12); }
  .bar i { display: block; height: 100%; width: 0; border-radius: 8px; background: var(--accent); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="bg" id="bg"></div><div class="grid"></div>
  <div class="kicker" id="kicker"></div>
  <div class="main" id="m"><h1 id="h"></h1><div class="sub" id="sub"></div><div class="src" id="src"></div></div>
  <div class="brand" id="brand">
    <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--accent)" stroke-width="8"/><path d="M34 62 L52 80 L88 40" fill="none" stroke="#F5F7FB" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Paycheck Truths
  </div>
  <div class="bar"><i id="prog"></i></div>
</div>
<script>
  const D = window.DATA;
  const THEMES = { green: ['#19D08A', '25,208,138'], gold: ['#FFC23D', '255,194,61'], red: ['#FF5A5F', '255,90,95'], blue: ['#4C8DFF', '76,141,255'] };
  const t = THEMES[D.theme] || THEMES.green;
  const card = document.getElementById('card'); card.style.setProperty('--accent', t[0]);
  document.getElementById('kicker').textContent = D.kicker || 'Money truth';
  const tmp = document.createElement('div'); tmp.innerHTML = D.headline;
  const words = [];
  tmp.childNodes.forEach(n => { const em = n.nodeName === 'EM'; n.textContent.split(/\s+/).filter(Boolean).forEach(w => words.push({ w, em })); });
  const h = document.getElementById('h');
  h.innerHTML = words.map(x => `<span class="w${x.em ? ' em' : ''}">${x.w}</span>`).join('');
  const sub = document.getElementById('sub'); if (D.sub) sub.textContent = D.sub; else sub.remove();
  const src = document.getElementById('src'); if (D.source) src.textContent = D.source; else src.remove();
  const m = document.getElementById('m');
  let size = 150;
  while ((m.scrollHeight > m.clientHeight + 1) && size > 40) { size -= 4; h.style.fontSize = size + 'px'; }
  window.__fit = size;
  const WS = 0.6, WD = 0.32;
  const subAt = WS + words.length * WD + 0.4;
  window.__duration = Math.max(8, subAt + 0.6 + 3.6);
  const clamp = x => Math.max(0, Math.min(1, x));
  const ease = x => 1 - Math.pow(1 - x, 3);
  const wEls = [...h.querySelectorAll('.w')];
  window.setT = function (s) {
    const k = document.getElementById('kicker'); const pk = ease(clamp(s / 0.5)); k.style.opacity = pk; k.style.transform = `translateY(${(1 - pk) * 20}px)`;
    wEls.forEach((el, i) => { const p = ease(clamp((s - (WS + i * WD)) / 0.3)); el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * 44}px) scale(${0.94 + 0.06 * p})`; });
    const ps = ease(clamp((s - subAt) / 0.5)); sub.style.opacity = ps; sub.style.transform = `translateY(${(1 - ps) * 24}px)`; src.style.opacity = ps;
    const pb = ease(clamp((s - 0.2) / 0.5)); document.getElementById('brand').style.opacity = pb;
    document.getElementById('prog').style.width = (clamp(s / window.__duration) * 100) + '%';
    const drift = Math.sin(s * 0.6) * 80;
    document.getElementById('bg').style.background = `radial-gradient(1100px 900px at ${100 + drift / 10}% ${-5 + drift / 20}%, rgba(${t[1]},.30), transparent 62%), radial-gradient(800px 700px at 0% 100%, rgba(76,141,255,.16), transparent 60%), linear-gradient(170deg, #0C1426 0%, #070B14 75%)`;
  };
  window.setT(0);
</script>
</body>
</html>
