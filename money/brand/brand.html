<!doctype html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Inter","Noto Color Emoji",sans-serif;background:#070B14;color:#F5F7FB}
.profile{width:1080px;height:1080px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(700px 700px at 70% 20%,rgba(25,208,138,.30),transparent 60%),linear-gradient(160deg,#0E1830,#070B14)}
.profile svg{width:640px;height:640px}
.cover{width:1640px;height:624px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(900px 600px at 85% 0%,rgba(25,208,138,.28),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(76,141,255,.16),transparent 60%),linear-gradient(160deg,#0E1830,#070B14)}
.cover::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:64px 64px}
.inner{position:relative;display:flex;align-items:center;gap:44px}
.inner svg{width:170px;height:170px}
.t1{font-size:112px;font-weight:900;letter-spacing:-.04em;line-height:1}
.t1 em{font-style:normal;color:#19D08A}
.t2{margin-top:14px;font-size:38px;font-weight:600;color:#B9C3DA;letter-spacing:-.01em}
</style></head><body>
<div class="profile" id="profile">
<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="#19D08A" stroke-width="8"/><path d="M34 62 L52 80 L88 40" fill="none" stroke="#F5F7FB" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
<div class="cover" id="cover"><div class="inner">
<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="#19D08A" stroke-width="8"/><path d="M34 62 L52 80 L88 40" fill="none" stroke="#F5F7FB" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div><div class="t1">Paycheck <em>Truths</em></div><div class="t2">Real money talk. No fluff. Every single day.</div></div>
</div></div>
</body></html>
