name: YouTube niche research (yt-dlp)
on:
  workflow_dispatch:
    inputs:
      config:
        description: "JSON config: channels (handles), searches (queries)"
        required: true
      name:
        description: "output name"
        default: "research"
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -U yt-dlp
      - name: Collect
        env:
          CFG: ${{ inputs.config }}
        run: |
          printf '%s' "$CFG" > /tmp/cfg.json
          mkdir -p research/out
          python3 research/yt_research.py /tmp/cfg.json research/out/${{ inputs.name }}.json
      - name: Save
        run: |
          git config user.name smalik-poster-bot; git config user.email actions@users.noreply.github.com
          git add research/out && git commit -q -m "research: ${{ inputs.name }}" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break || sleep 5; done
