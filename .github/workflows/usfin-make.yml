name: US finance pages - make today's posts (Claude)

on:
  workflow_dispatch:
    inputs:
      page:
        description: "which page (credit | closing | fineprint)"
        default: "credit"
        type: choice
        options: [credit, closing, fineprint]
      dry_run:
        description: "true = make the posts but keep them in drafts (don't queue for publishing)"
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write
  id-token: write
  actions: write

concurrency:
  group: usfin-${{ inputs.page }}
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SLUG: ${{ inputs.page }}
      PAGE_ID_CREDIT: ${{ secrets.CREDIT_FB_PAGE_ID }}
      PAGE_ID_CLOSING: ${{ secrets.CLOSING_FB_PAGE_ID }}
      PAGE_ID_FINEPRINT: ${{ secrets.FINEPRINT_FB_PAGE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide what to do
        id: s
        run: |
          DRY="${{ inputs.dry_run }}"
          TARGET=$(TZ=America/New_York date -d '+12 hours' +%F)
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"; echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          VAR="PAGE_ID_$(echo "$SLUG" | tr a-z A-Z)"
          SKIP=no
          if [ "$DRY" = "false" ] && [ -z "${!VAR}" ]; then SKIP=yes; echo "$SLUG page not connected yet - skipping."; fi
          if ls usfin/$SLUG/posted/$TARGET-* usfin/$SLUG/queue/$TARGET-* >/dev/null 2>&1 && [ "$DRY" = "false" ]; then SKIP=yes; echo "Already made for $TARGET."; fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.s.outputs.skip == 'no'
        with:
          python-version: "3.12"

      - name: Install tools and fonts
        if: steps.s.outputs.skip == 'no'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter fonts-noto-color-emoji >/dev/null
          pip install -q requests playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Learn from what performed best
        if: steps.s.outputs.skip == 'no'
        continue-on-error: true
        env:
          CREDIT_FB_PAGE_ID: ${{ secrets.CREDIT_FB_PAGE_ID }}
          CREDIT_FB_PAGE_TOKEN: ${{ secrets.CREDIT_FB_PAGE_TOKEN }}
          CLOSING_FB_PAGE_ID: ${{ secrets.CLOSING_FB_PAGE_ID }}
          CLOSING_FB_PAGE_TOKEN: ${{ secrets.CLOSING_FB_PAGE_TOKEN }}
          FINEPRINT_FB_PAGE_ID: ${{ secrets.FINEPRINT_FB_PAGE_ID }}
          FINEPRINT_FB_PAGE_TOKEN: ${{ secrets.FINEPRINT_FB_PAGE_TOKEN }}
        run: python perf.py "$SLUG"

      - name: Claude researches, writes and builds the 8 posts
        if: steps.s.outputs.skip == 'no'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "github-actions"  # started by the 6 AM Paycheck job
          prompt: |
            Read usfin/PROMPT.md in the repository root and follow it exactly.
            PAGE_SLUG = ${{ inputs.page }}
            TARGET_DATE = ${{ steps.s.outputs.target }}
          claude_args: |
            --max-turns 70
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

      - name: Check the posts were made
        if: steps.s.outputs.skip == 'no'
        run: |
          N=$(ls usfin/$SLUG/queue/${{ steps.s.outputs.target }}-*.json | wc -l); echo "posts: $N"; test "$N" -ge 6

      - name: Dry run - keep as drafts
        if: steps.s.outputs.skip == 'no' && steps.s.outputs.dry == 'true'
        run: |
          mkdir -p usfin/$SLUG/drafts
          mv usfin/$SLUG/queue/${{ steps.s.outputs.target }}-* usfin/$SLUG/drafts/

      - name: Save
        if: always() && steps.s.outputs.skip == 'no'
        run: |
          git config user.name "usfin-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A usfin/$SLUG/queue usfin/$SLUG/drafts status/perf-$SLUG.md || true
          git diff --cached --quiet || (git commit -m "$SLUG page: posts for ${{ steps.s.outputs.target }}" && git pull --rebase -q && git push)
