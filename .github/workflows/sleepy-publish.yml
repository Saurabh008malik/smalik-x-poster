name: The Sleepy Biographer - publish due videos and Shorts

on:
  schedule:
    - cron: "10,40 * * * *"      # checks the queue twice an hour; does nothing unless an item is due
  workflow_dispatch:
    inputs:
      action:
        description: "publish = post anything due now; whoami = only check which channel is connected"
        default: "publish"
        type: choice
        options: ["publish", "whoami", "tokentest", "uploadtest", "cleanup"]

permissions:
  contents: write

concurrency:
  group: sleepy
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Remove leftover test branch
        run: git push -q origin --delete feed-test || true

      - name: Cleanup backup branches (only when asked)
        if: inputs.action == 'cleanup'
        run: |
          for b in $(git ls-remote --heads origin 'backup-*' | sed 's#.*refs/heads/##'); do echo "deleting $b"; git push -q origin --delete "$b" || true; done

      - name: Anything due?
        id: d
        run: |
          pip install -q requests
          N=$(python sleepy/yt.py due)
          echo "due=$N" >> "$GITHUB_OUTPUT"
          echo "Items due: $N"

      - name: Check hook
        if: steps.d.outputs.due != '0' || inputs.action == 'whoami' || inputs.action == 'tokentest' || inputs.action == 'uploadtest'
        env:
          SLEEPY_HOOK: ${{ secrets.SLEEPY_HOOK }}
        run: |
          if [ -z "$SLEEPY_HOOK" ]; then echo "SLEEPY_HOOK secret is not set yet - finish the Apps Script setup." | tee -a "$GITHUB_STEP_SUMMARY"; exit 1; fi

      - name: Who is connected / token test
        if: inputs.action == 'whoami' || inputs.action == 'tokentest'
        env:
          SLEEPY_HOOK: ${{ secrets.SLEEPY_HOOK }}
        run: python sleepy/yt.py ${{ inputs.action }}

      - name: Upload test (5-second clip, deleted after)
        if: inputs.action == 'uploadtest'
        env:
          SLEEPY_HOOK: ${{ secrets.SLEEPY_HOOK }}
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          python sleepy/yt.py uploadtest

      - name: Publish
        if: steps.d.outputs.due != '0' && inputs.action != 'whoami' && inputs.action != 'tokentest' && inputs.action != 'uploadtest'
        env:
          SLEEPY_HOOK: ${{ secrets.SLEEPY_HOOK }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sleepy/yt.py publish

      - name: Save queue
        if: always() && steps.d.outputs.due != '0' && inputs.action != 'whoami' && inputs.action != 'tokentest' && inputs.action != 'uploadtest'
        run: |
          git config user.name "sleepy-biographer-bot"; git config user.email "actions@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; git config --local --unset-all credential.helper 2>/dev/null || true
          git add sleepy/queue.json
          git commit -m "Sleepy Biographer: queue update" && for i in 1 2 3 4; do git pull --rebase -q origin main && git push origin HEAD:main && break || sleep 7; done; git diff --quiet origin/main HEAD || true
