name: Watchdog - make sure every page has today's posts

# Safety net. The 6 AM IST job normally starts every page's daily "make". If any page still has no
# posts for its next day (job never started, or Claude failed), this restarts that page's make.
# Also restarts the cricket / X morning and evening posts and the X news flashes if they never went out.
# It does nothing when everything is fine. Runs hourly from 7:20 AM to 11:20 PM IST.
on:
  schedule:
    - cron: "50 1-17 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HAVE_CREDIT: ${{ secrets.CREDIT_FB_PAGE_ID != '' }}
      HAVE_CLOSING: ${{ secrets.CLOSING_FB_PAGE_ID != '' }}
      HAVE_FINEPRINT: ${{ secrets.FINEPRINT_FB_PAGE_ID != '' }}
      HAVE_MONEY: ${{ secrets.MONEY_FB_PAGE_ID != '' }}
      HAVE_ADDA: ${{ secrets.ADDA_FB_PAGE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Restart any page that has no posts for its next day
        run: |
          US_TARGET=$(TZ=America/New_York date -d '+12 hours' +%F)
          IST_TODAY=$(TZ=Asia/Kolkata date +%F)
          TODAY_UTC=$(date -u +%F)

          # $1 workflow file, $2 max tries today
          busy_or_capped () {
            RUNS=$(gh api "repos/$REPO/actions/workflows/$1/runs?created=%3E%3D$TODAY_UTC&per_page=50" --jq '.workflow_runs')
            ACTIVE=$(echo "$RUNS" | jq '[.[]|select(.status!="completed")]|length')
            TRIES=$(echo "$RUNS" | jq 'length')
            [ "$ACTIVE" -gt 0 ] && { echo "$1 is already running."; return 0; }
            [ "$TRIES" -ge "$2" ] && { echo "$1 already tried $TRIES times today - stopping."; return 0; }
            return 1
          }
          have_posts () { ls $1/posted/$2-* $1/queue/$2-* >/dev/null 2>&1; }

          # Paycheck Truths
          if [ "$HAVE_MONEY" = "true" ] && ! have_posts money "$US_TARGET"; then
            echo "Paycheck Truths has no posts for $US_TARGET."
            busy_or_capped money-make.yml 8 || gh api -X POST "repos/$REPO/actions/workflows/money-make.yml/dispatches" -f ref=main -f 'inputs[dry_run]=false'
          fi
          # Creator Adda (named by IST date)
          if [ "$HAVE_ADDA" = "true" ] && ! have_posts adda "$IST_TODAY"; then
            echo "Creator Adda has no posts for $IST_TODAY."
            busy_or_capped adda-make.yml 12 || gh api -X POST "repos/$REPO/actions/workflows/adda-make.yml/dispatches" -f ref=main -f 'inputs[mode]=make' -f 'inputs[dry_run]=false'
          fi
          # US finance pages (only pages that are connected)
          for P in credit closing fineprint; do
            V="HAVE_$(echo $P | tr a-z A-Z)"
            if [ "${!V}" = "true" ] && ! have_posts usfin/$P "$US_TARGET"; then
              echo "$P has no posts for $US_TARGET."
              busy_or_capped usfin-make.yml 12 || gh api -X POST "repos/$REPO/actions/workflows/usfin-make.yml/dispatches" -f ref=main -f "inputs[page]=$P" -f 'inputs[dry_run]=false'
            fi
          done

          # Cricket / X: morning post due from 9:15 AM IST, evening post due from 8:15 PM IST
          HM=$((10#$(TZ=Asia/Kolkata date +%H%M)))
          cricket_busy_or_capped () {
            RUNS=$(gh api "repos/$REPO/actions/workflows/daily.yml/runs?created=%3E%3D$TODAY_UTC&per_page=100" --jq '[.[]|select(.event=="workflow_dispatch")]')
            ACTIVE=$(echo "$RUNS" | jq '[.[]|select(.status!="completed")]|length')
            TRIES=$(echo "$RUNS" | jq 'length')
            [ "$ACTIVE" -gt 0 ] && { echo "daily.yml is already running."; return 0; }
            [ "$TRIES" -ge 10 ] && { echo "daily.yml already tried $TRIES times today - stopping."; return 0; }
            return 1
          }
          for SLOT in morning evening; do
            if [ "$SLOT" = "morning" ]; then DUE=$([ "$HM" -ge 915 ] && echo yes || echo no); else DUE=$([ "$HM" -ge 2015 ] && echo yes || echo no); fi
            if [ "$DUE" = "yes" ] && [ ! -f "posted/$IST_TODAY-$SLOT.json" ]; then
              echo "Cricket / X $SLOT post for $IST_TODAY has not gone out."
              cricket_busy_or_capped || gh api -X POST "repos/$REPO/actions/workflows/daily.yml/dispatches" -f ref=main -f "inputs[slot]=$SLOT" -f 'inputs[dry_run]=false'
            fi
          done
          # X news flashes: any slot more than 15 minutes overdue (and under 2.5 hours) that is still unposted -> restart the flash run.
          # The run researches FRESH news at that moment, so a late post is never old news.
          NOWM=$(( 10#$(TZ=Asia/Kolkata date +%H)*60 + 10#$(TZ=Asia/Kolkata date +%M) ))
          OVERDUE=""
          for S in 450 540 630 720 810 900 990 1080 1260 1350; do
            K=$(printf "%02d%02d" $((S/60)) $((S%60)))
            if [ "$NOWM" -ge $((S+15)) ] && [ "$NOWM" -le $((S+150)) ] && [ ! -f "posted/$IST_TODAY-flash-$K.json" ]; then OVERDUE="$OVERDUE $K"; fi
          done
          if [ -n "$OVERDUE" ]; then
            echo "X flash slot(s) overdue:$OVERDUE"
            FR=$(gh api "repos/$REPO/actions/workflows/xflash.yml/runs?created=%3E%3D$TODAY_UTC&per_page=100" --jq '.workflow_runs')
            FACTIVE=$(echo "$FR" | jq '[.[]|select(.status!="completed")]|length')
            FTRIES=$(echo "$FR" | jq '[.[]|select(.event=="workflow_dispatch")]|length')
            if [ "$FACTIVE" -gt 0 ]; then echo "xflash.yml is already running."
            elif [ "$FTRIES" -ge 25 ]; then echo "xflash.yml already restarted $FTRIES times today - stopping."
            else gh api -X POST "repos/$REPO/actions/workflows/xflash.yml/dispatches" -f ref=main -f 'inputs[dry_run]=false'; fi
          fi
          echo "Watchdog finished."
