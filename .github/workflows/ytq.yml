name: YouTube helper - first comments and Shorts (Lamplight Scripture + The Sleepy Biographer)

on:
  schedule:
    # Backup only (GitHub minutes are limited): just after the Short slots. The real triggers are the scheduled-task heartbeats.
    - cron: "10 2 * * *"
    - cron: "20 4 * * *"
    - cron: "40 18 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "run = post whatever is due; whoami = check both hooks; uploadtest = 5-second unlisted upload test (channel below)"
        default: "run"
        type: choice
        options: ["run", "whoami", "uploadtest"]
      channel:
        description: "channel for uploadtest"
        default: "lamplight"
        type: choice
        options: ["lamplight", "sleepy"]

permissions:
  contents: write

concurrency:
  group: ytq
  cancel-in-progress: false

jobs:
  ytq:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Anything due?
        id: d
        run: |
          pip install -q requests
          N=$(python ytq/ytq.py due)
          echo "due=$N" >> "$GITHUB_OUTPUT"
          echo "Items due: $N"

      - name: Who is connected
        if: inputs.action == 'whoami'
        env:
          LAMPLIGHT_HOOK: ${{ secrets.LAMPLIGHT_HOOK }}
          SLEEPY_HOOK: ${{ secrets.SLEEPY_HOOK }}
        run: python ytq/ytq.py whoami

      - name: Upload test (unlisted 5 s clip, then deleted)
        if: inputs.action == 'uploadtest'
        env:
          LAMPLIGHT_HOOK: ${{ secrets.LAMPLIGHT_HOOK }}
          SLEEPY_HOOK: ${{ secrets.SLEEPY_HOOK }}
          TEST_CHANNEL: ${{ inputs.channel }}
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          python ytq/ytq.py uploadtest

      - name: Post what is due
        if: steps.d.outputs.due != '0' && inputs.action != 'whoami' && inputs.action != 'uploadtest'
        env:
          LAMPLIGHT_HOOK: ${{ secrets.LAMPLIGHT_HOOK }}
          SLEEPY_HOOK: ${{ secrets.SLEEPY_HOOK }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ytq/ytq.py run

      - name: Save queue
        if: always() && steps.d.outputs.due != '0' && inputs.action != 'whoami' && inputs.action != 'uploadtest' && inputs.action != 'uploadtest'
        run: |
          git config user.name "ytq-bot"; git config user.email "actions@users.noreply.github.com"
          git add ytq/comments.json ytq/shorts.json
          git commit -m "ytq: queue update" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push -q && break || sleep 5; done
