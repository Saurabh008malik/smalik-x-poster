name: Warm Mug Radio - build and post a mix

on:
  schedule:
    - cron: "37 0 * * *"   # backup only: daily 6:07 AM IST, builds only if a mix is planned for today (main trigger is the 6 AM money job)
  push:
    branches: [main]
    paths: ["warmmug/art.py", "warmmug/build.py"]   # new music/code = build a preview
  workflow_dispatch:
    inputs:
      mode:
        description: "post = build and publish on YouTube; preview = build only (download the video from this run's Artifacts)"
        default: "preview"
        type: choice
        options: ["preview", "post"]
      min_minutes:
        description: "Smallest mix allowed (minutes)"
        default: "12"

permissions:
  contents: write

concurrency:
  group: warmmug
  cancel-in-progress: false

jobs:
  mix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Decide
        id: s
        env:
          HAVE_HOOK: ${{ secrets.WARMMUG_HOOK != '' }}
        run: |
          MODE="${{ inputs.mode }}"; [ -z "$MODE" ] && MODE=post
          [ "${{ github.event_name }}" = "push" ] && MODE=preview
          TODAY=$(TZ=Asia/Kolkata date +%F)
          SKIP=no
          if [ "$MODE" = "post" ] && grep -q "\"date\": \"$TODAY\"" warmmug/published.json 2>/dev/null; then
            SKIP=yes; echo "Already posted today ($TODAY)."; fi
          if [ "$MODE" = "post" ] && [ ! -f warmmug/secret/yt_token.enc ] && [ "$HAVE_HOOK" != "true" ]; then
            SKIP=yes; echo "YouTube not connected yet - add the WARMMUG_HOOK secret (Apps Script web app link) first." | tee -a "$GITHUB_STEP_SUMMARY"; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"; echo "today=$TODAY" >> "$GITHUB_OUTPUT"; echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.s.outputs.skip == 'no'
        with:
          python-version: "3.12"

      - name: Install tools
        if: steps.s.outputs.skip == 'no'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji >/dev/null
          pip install -q requests pillow playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Build the mix (music + art + video)
        id: b
        if: steps.s.outputs.skip == 'no'
        run: |
          set +e
          python warmmug/build.py --min-min "${{ inputs.min_minutes || '12' }}" $([ "${{ steps.s.outputs.mode }}" = preview ] && echo --next)
          code=$?
          if [ $code -eq 3 ]; then echo "built=no" >> "$GITHUB_OUTPUT"; cat warmmug/out/skip.txt >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          [ $code -eq 0 ] && echo "built=yes" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Preview files
        if: steps.b.outputs.built == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: warm-mug-mix
          path: |
            warmmug/out/video.mp4
            warmmug/out/thumbnail.jpg
            warmmug/out/meta.json
          retention-days: 7

      - name: Post to YouTube
        if: steps.b.outputs.built == 'yes' && steps.s.outputs.mode == 'post'
        env:
          WM_KEY: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          WARMMUG_HOOK: ${{ secrets.WARMMUG_HOOK }}
        run: |
          python warmmug/yt.py whoami
          python warmmug/yt.py upload

      - name: Record what was posted
        if: steps.b.outputs.built == 'yes' && steps.s.outputs.mode == 'post'
        run: |
          python - <<'EOF'
          import json, pathlib
          d = pathlib.Path("warmmug")
          meta = json.loads((d / "out/meta.json").read_text()); res = json.loads((d / "out/result.json").read_text())
          p = d / "published.json"; pub = json.loads(p.read_text()) if p.exists() else []
          pub.append({"date": "${{ steps.s.outputs.today }}", "title": meta["title"], "url": res["url"],
                      "minutes": meta["minutes"], "tracks": meta["tracks"], "track_urls": meta["track_urls"]})
          p.write_text(json.dumps(pub, indent=2, ensure_ascii=False))
          EOF
          git config user.name "warm-mug-radio-bot"; git config user.email "actions@users.noreply.github.com"
          git add warmmug/published.json
          git commit -m "Warm Mug Radio: posted mix ${{ steps.s.outputs.today }}" && git pull --rebase -q && git push
