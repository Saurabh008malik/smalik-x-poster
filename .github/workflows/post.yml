name: Post queued tweets

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "post = post due items, check = only test the X + Facebook keys"
        default: "post"
        type: choice
        options: [post, check, comment, instagram]
      names:
        description: "for mode=instagram: space-separated posted/*.json names to publish to Instagram"
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Anything queued?
        id: q
        run: |
          if [ "${{ inputs.mode }}" = "check" ] || [ "${{ inputs.mode }}" = "comment" ] || [ "${{ inputs.mode }}" = "instagram" ] || ls queue/*.json >/dev/null 2>&1; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Queue empty."; echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.q.outputs.run == 'yes'
        with:
          python-version: "3.12"

      - name: Post
        if: steps.q.outputs.run == 'yes'
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          NAMES: ${{ inputs.names }}
        run: |
          pip install -q requests requests-oauthlib
          if [ "${{ inputs.mode }}" = "instagram" ]; then python poster.py instagram $NAMES
          else python poster.py ${{ (inputs.mode == 'check' || inputs.mode == 'comment') && inputs.mode || '' }}; fi

      - name: Save queue changes
        if: always() && steps.q.outputs.run == 'yes'
        run: |
          git config user.name "smalik-poster-bot"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; git config --local --unset-all credential.helper 2>/dev/null || true
          git config user.email "actions@users.noreply.github.com"
          for d in queue posted failed status; do [ -e "$d" ] && git add -A "$d" || true; done
          git diff --cached --quiet || (git commit -m "Poster: update queue" && git push)
