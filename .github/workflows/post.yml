name: Post queued tweets

on:
  schedule:
    # every 15 min in the two posting windows (UTC):
    # 03:00–05:59 UTC = 8:30–11:29 AM IST, 14:00–16:59 UTC = 7:30–10:29 PM IST
    - cron: "*/15 3-5 * * *"
    - cron: "*/15 14-16 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "post = post due items, check = only test the X + Facebook keys"
        default: "post"
        type: choice
        options: [post, check]

permissions:
  contents: write

concurrency:
  group: poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Anything queued?
        id: q
        run: |
          if [ "${{ inputs.mode }}" = "check" ] || ls queue/*.json >/dev/null 2>&1; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "Queue empty."; echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.q.outputs.run == 'yes'
        with:
          python-version: "3.12"

      - name: Post
        if: steps.q.outputs.run == 'yes'
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          pip install -q requests requests-oauthlib
          python poster.py ${{ inputs.mode == 'check' && 'check' || '' }}

      - name: Save queue changes
        if: always() && steps.q.outputs.run == 'yes' && inputs.mode != 'check'
        run: |
          git config user.name "smalik-poster-bot"
          git config user.email "actions@users.noreply.github.com"
          for d in queue posted failed; do [ -e "$d" ] && git add -A "$d" || true; done
          git diff --cached --quiet || (git commit -m "Poster: update queue" && git push)
