name: X + Cricket Ki Baat news flash (fresh news only)

# Extra posts for @Smalik_wc AND the Cricket Ki Baat Facebook Page + Instagram (same schedule, rule 11 Nov 2026), so they post like the big cricket accounts (about 12 a day with the morning and evening card posts).
# Each run writes ONE fresh-news tweet and posts it. Rules (10 Nov 2026):
#  1. NO MISSED SLOTS: the 10 slot timers have backup timers every 30 minutes, the watchdog re-checks every hour, and a run always
#     fills the earliest unposted slot of the day (up to 2.5 hours late). Each slot is tried up to 3 times; the last try falls back
#     to a fan-question tweet (not news), so a slot is never empty.
#  2. NEVER OLD NEWS: the tweet is researched fresh at the moment the run happens, so a late run still posts what is new NOW.
on:
  schedule:
    # Slots (IST): 07:30, 09:00, 10:30, 12:00, 13:30, 15:00, 16:30, 18:00, 21:00, 22:30
    # Main timers on the slot, then a backup timer every 30 minutes all day (a backup only acts if a slot is still unposted).
    - cron: "0 2 * * *"
    - cron: "30 3 * * *"
    - cron: "0 5 * * *"
    - cron: "30 6 * * *"
    - cron: "0 8 * * *"
    - cron: "30 9 * * *"
    - cron: "0 11 * * *"
    - cron: "30 12 * * *"
    - cron: "30 15 * * *"
    - cron: "0 17 * * *"
    - cron: "20,50 2-17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = test: make a tweet but do not publish (saved to drafts/). false = fill the earliest unposted slot (used by the watchdog)"
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: xflash
  cancel-in-progress: false

jobs:
  flash:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Work out the slot (always the earliest unposted slot, never skipped for being late)
        id: s
        run: |
          DATE=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          NOWM=$(( 10#$(TZ=Asia/Kolkata date +%H)*60 + 10#$(TZ=Asia/Kolkata date +%M) ))
          KEY=""; DRY=false; TRY=0
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            KEY=$(printf "%02d%02d" $((NOWM/60)) $((NOWM%60))); DRY=true
          else
            for S in 450 540 630 720 810 900 990 1080 1260 1350; do
              [ "$NOWM" -lt "$S" ] && break
              [ $(( NOWM - S )) -gt 150 ] && continue
              K=$(printf "%02d%02d" $((S/60)) $((S%60)))
              [ -f "posted/$DATE-flash-$K.json" ] && continue
              [ -f "queue/$DATE-flash-$K.json" ] && continue
              T=$(cat "failed/$DATE-flash-$K.tries" 2>/dev/null | wc -l)
              [ "$T" -ge 3 ] && continue
              KEY=$K; TRY=$((T+1)); break
            done
          fi
          if [ -z "$KEY" ]; then SKIP=yes; echo "Every slot due so far is already posted (or used its 3 tries). Nothing to do."; else
            SKIP=no; mkdir -p failed; echo "$(date -u +%FT%TZ)" >> "failed/$DATE-flash-$KEY.tries"; fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"; echo "key=$KEY" >> "$GITHUB_OUTPUT"; echo "dry=$DRY" >> "$GITHUB_OUTPUT"
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"; echo "try=$TRY" >> "$GITHUB_OUTPUT"
          echo "Date=$DATE Slot=$KEY Try=$TRY Dry=$DRY Skip=$SKIP"

      - uses: actions/setup-python@v5
        if: steps.s.outputs.skip == 'no'
        with:
          python-version: "3.12"

      - name: Install card tools and fonts
        if: steps.s.outputs.skip == 'no'
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter fonts-noto-color-emoji >/dev/null
          pip install -q requests requests-oauthlib playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Claude finds fresh news and writes the tweet
        id: a1
        continue-on-error: true
        if: steps.s.outputs.skip == 'no'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "*"   # runs started by the watchdog / timers are bot-started; without this Claude is rejected and the slot is missed
          prompt: |
            Read PROMPT-xflash.md in the repository root and follow it exactly.
            DATE (IST) = ${{ steps.s.outputs.date }}
            KEY (IST HHMM) = ${{ steps.s.outputs.key }}
            Write the file queue/${{ steps.s.outputs.date }}-flash-${{ steps.s.outputs.key }}.json
          claude_args: |
            --max-turns 50
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

      - name: One quick retry if Claude stopped early (no waiting, so the news stays fresh)
        id: a2
        continue-on-error: true
        if: steps.s.outputs.skip == 'no' && steps.a1.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "*"   # runs started by the watchdog / timers are bot-started; without this Claude is rejected and the slot is missed
          prompt: |
            Read PROMPT-xflash.md in the repository root and follow it exactly.
            DATE (IST) = ${{ steps.s.outputs.date }}
            KEY (IST HHMM) = ${{ steps.s.outputs.key }}
            Write the file queue/${{ steps.s.outputs.date }}-flash-${{ steps.s.outputs.key }}.json
          claude_args: |
            --max-turns 50
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

      - name: Was a tweet written?
        id: w
        if: steps.s.outputs.skip == 'no'
        run: |
          F="queue/${{ steps.s.outputs.date }}-flash-${{ steps.s.outputs.key }}.json"
          if [ -f "$F" ] && python -c "import json;d=json.load(open('$F'));assert d['text'].strip()"; then echo "have=yes" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.s.outputs.try }}" -ge 3 ] && [ "${{ steps.s.outputs.dry }}" = "false" ]; then
            echo "Third try and still no verified fresh news: posting a fan-question tweet (not news) so the slot is not empty."
            python3 reserve/fan_tweet.py "${{ steps.s.outputs.date }}" "${{ steps.s.outputs.key }}" && echo "have=yes" >> "$GITHUB_OUTPUT"
          else echo "No fresh tweet this try - the backup timer or the watchdog will try this slot again."; echo "have=no" >> "$GITHUB_OUTPUT"; fi

      - name: Make sure every file the post needs exists (missing card = text post, never a missed slot)
        if: steps.w.outputs.have == 'yes'
        run: |
          python3 - "queue/${{ steps.s.outputs.date }}-flash-${{ steps.s.outputs.key }}.json" <<'PY'
          import json, pathlib, sys
          p = pathlib.Path(sys.argv[1]); d = json.loads(p.read_text(encoding="utf-8"))
          q = p.parent
          if d.get("image") and not (q / d["image"]).exists():
              print("X card missing - tweet goes out as text"); d.pop("image")
          fb = d.get("facebook") or {}
          if fb.get("image") and not (q / fb["image"]).exists():
              print("Facebook card missing - Facebook text post, Instagram skipped"); fb.pop("image")
          if "facebook" in d.get("platforms", []) and not fb.get("caption"):
              print("No Facebook caption - X only"); d["platforms"] = ["x"]
          p.write_text(json.dumps(d, ensure_ascii=False, indent=1), encoding="utf-8")
          print("platforms:", d.get("platforms"), "| x card:", bool(d.get("image")), "| fb card:", bool(fb.get("image")))
          PY

      - name: Dry run - keep as draft
        if: steps.w.outputs.have == 'yes' && steps.s.outputs.dry == 'true'
        run: |
          mkdir -p drafts
          mv queue/${{ steps.s.outputs.date }}-flash-${{ steps.s.outputs.key }}* drafts/
          cat drafts/${{ steps.s.outputs.date }}-flash-${{ steps.s.outputs.key }}.json

      - name: Publish to X + Cricket Ki Baat (Facebook, Instagram)
        if: steps.w.outputs.have == 'yes' && steps.s.outputs.dry == 'false'
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          pip install -q requests requests-oauthlib
          python poster.py flash

      - name: Save results
        if: always() && steps.s.outputs.skip == 'no'
        run: |
          git config user.name "smalik-poster-bot"
          git config user.email "actions@users.noreply.github.com"
          for d in queue posted failed drafts; do [ -e "$d" ] && git add -A "$d" || true; done
          # a tweet that failed to reach X goes back for another try (up to 3) instead of being lost
          for q in queue/*-flash-*; do [ -e "$q" ] && git rm -q --cached "$q" 2>/dev/null; [ -e "$q" ] && rm -f "$q"; done
          git diff --cached --quiet && exit 0
          git commit -m "X flash ${{ steps.s.outputs.date }} ${{ steps.s.outputs.key }}"
          for i in 1 2 3 4; do git pull --rebase -q && git push && break || sleep 5; done
