name: Money page - publish due posts

on:
  schedule:
    - cron: "5 11-23,0-2 * * *"   # hourly at :05 across the US daytime/evening window (UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: "post = publish due posts, check = test the Page token"
        default: "post"
        type: choice
        options: [post, check, delete, instagram]
      target:
        description: "for mode=delete: the Facebook post/video id to delete; for mode=instagram: space-separated money/posted/*.json names"
        default: ""
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: poster
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Publish
        env:
          MONEY_FB_PAGE_ID: ${{ secrets.MONEY_FB_PAGE_ID }}
          MONEY_FB_PAGE_TOKEN: ${{ secrets.MONEY_FB_PAGE_TOKEN }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ "${{ inputs.mode }}" = "check" ]; then python money/poster.py check
          elif [ "${{ inputs.mode }}" = "delete" ]; then python money/poster.py delete "$TARGET"
          elif [ "${{ inputs.mode }}" = "instagram" ]; then python money/poster.py instagram $TARGET
          else python money/poster.py; fi
      - name: Publish Creator Adda (reel + evening post)
        if: always() && (inputs.mode == '' || inputs.mode == 'post')
        continue-on-error: true
        env:
          ADDA_FB_PAGE_ID: ${{ secrets.ADDA_FB_PAGE_ID }}
          ADDA_FB_PAGE_TOKEN: ${{ secrets.ADDA_FB_PAGE_TOKEN }}
          MONEY_FB_PAGE_TOKEN: ${{ secrets.MONEY_FB_PAGE_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python adda/poster.py
      - name: Publish US finance pages (Credit Score Truths, Closing Costs, Fine Print Facts)
        if: always() && (inputs.mode == '' || inputs.mode == 'post')
        continue-on-error: true
        env:
          CREDIT_FB_PAGE_ID: ${{ secrets.CREDIT_FB_PAGE_ID }}
          CREDIT_FB_PAGE_TOKEN: ${{ secrets.CREDIT_FB_PAGE_TOKEN }}
          CLOSING_FB_PAGE_ID: ${{ secrets.CLOSING_FB_PAGE_ID }}
          CLOSING_FB_PAGE_TOKEN: ${{ secrets.CLOSING_FB_PAGE_TOKEN }}
          FINEPRINT_FB_PAGE_ID: ${{ secrets.FINEPRINT_FB_PAGE_ID }}
          FINEPRINT_FB_PAGE_TOKEN: ${{ secrets.FINEPRINT_FB_PAGE_TOKEN }}
        run: python usfin/poster.py
      - name: Start Warm Mug Radio Short 2 of the day (from about 6:40 PM IST; the Short job skips itself once 2 are posted)
        if: always() && (inputs.mode == '' || inputs.mode == 'post')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          H=$(date -u +%H)
          if [ "$H" = "13" ] || [ "$H" = "14" ] || [ "$H" = "15" ]; then
            gh api -X POST repos/${{ github.repository }}/actions/workflows/warmmug-shorts.yml/dispatches \
              -f ref=main -f 'inputs[mode]=post' || echo "Could not start Warm Mug Short 2"
          fi
      - name: Save
        if: always()
        run: |
          git config user.name "paycheck-truths-bot"; git config user.email "actions@users.noreply.github.com"
          for d in money/queue money/posted money/failed adda/queue adda/posted adda/failed usfin/credit usfin/closing usfin/fineprint status; do [ -e "$d" ] && git add -A "$d" || true; done
          git diff --cached --quiet || (git commit -m "Money page: publish run" && for i in 1 2 3 4; do git pull --rebase -q origin main && git push origin HEAD:main && break || sleep 7; done; git diff --quiet origin/main HEAD)
