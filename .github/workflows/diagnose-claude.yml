name: Diagnose Claude login (shows the real error)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/diagnose-claude.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code >/dev/null 2>&1; claude --version
      - name: Ask one tiny question and print everything
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          claude -p "Reply with the single word OK." --output-format json --max-turns 1 > out.json 2> err.txt
          echo "exit code: $?"
          echo "---- stdout"; cat out.json
          echo; echo "---- stderr"; cat err.txt
