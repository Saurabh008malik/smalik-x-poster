name: Fetch public-domain assets
on:
  workflow_dispatch:
    inputs:
      config: {description: "JSON config", required: true}
      name: {description: "asset set name", required: true}
permissions: {contents: write}
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q requests
      - name: Fetch
        env:
          CFG: ${{ inputs.config }}
        run: |
          printf '%s' "$CFG" > /tmp/cfg.json
          python3 research/fetch_assets.py /tmp/cfg.json /tmp/assets
          mkdir -p research/assets
          (cd /tmp/assets && zip -q -r "/tmp/${{ inputs.name }}.zip" .)
          split -b 90m -d -a 2 "/tmp/${{ inputs.name }}.zip" "research/assets/${{ inputs.name }}.zip.part"
          ls -la research/assets
      - name: Save
        run: |
          git config user.name smalik-poster-bot; git config user.email actions@users.noreply.github.com
          git add research/assets && git commit -q -m "assets: ${{ inputs.name }}" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break || sleep 5; done
