name: Daily cricket post (Claude + post)

on:
  schedule:
    - cron: "11 3 * * *"    # 8:41 AM IST  -> morning
    - cron: "41 4 * * *"    # backup retry (skipped automatically if already posted)
    - cron: "11 6 * * *"    # backup retry
    - cron: "11 14 * * *"   # 7:41 PM IST  -> evening
    - cron: "41 15 * * *"   # backup retry
    - cron: "11 17 * * *"   # backup retry
  workflow_dispatch:
    inputs:
      slot:
        description: "morning or evening"
        default: "evening"
        type: choice
        options: [morning, evening]
      dry_run:
        description: "true = make the post but don't publish (saved to drafts/)"
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: write
  id-token: write

concurrency:
  group: poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Work out slot and date
        id: s
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # GitHub's own timer often fires hours late: only act inside the right IST window, else skip.
            HM=$((10#$(TZ=Asia/Kolkata date +%H%M)))
            if [ "$HM" -ge 830 ] && [ "$HM" -lt 1330 ]; then SLOT=morning
            elif [ "$HM" -ge 1930 ]; then SLOT=evening
            else SLOT=none; fi
            DRY=false
          else
            SLOT="${{ inputs.slot }}"; DRY="${{ inputs.dry_run }}"
          fi
          DATE=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"; echo "date=$DATE" >> "$GITHUB_OUTPUT"; echo "dry=$DRY" >> "$GITHUB_OUTPUT"
          if [ "$SLOT" = "none" ] || { [ -f "posted/$DATE-$SLOT.json" ] && [ "$DRY" = "false" ]; }; then echo "skip=yes" >> "$GITHUB_OUTPUT"; else echo "skip=no" >> "$GITHUB_OUTPUT"; fi
          echo "Slot=$SLOT Date=$DATE Dry=$DRY"

      - uses: actions/setup-python@v5
        if: steps.s.outputs.skip == 'no'
        with:
          python-version: "3.12"

      - name: Install tools and fonts
        if: steps.s.outputs.skip == 'no'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter fonts-noto-color-emoji >/dev/null
          pip install -q requests requests-oauthlib playwright
          python -m playwright install --with-deps chromium >/dev/null

      - name: Learn from what performed best
        if: steps.s.outputs.skip == 'no'
        continue-on-error: true
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          pip install -q requests
          python perf.py cricket
      - name: Claude researches, writes and makes the cards
        id: a1
        continue-on-error: true
        if: steps.s.outputs.skip == 'no'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "*"   # runs started by the watchdog / timers are bot-started; without this Claude is rejected and the slot is missed
          prompt: |
            Read PROMPT.md in the repository root and follow it exactly.
            SLOT = ${{ steps.s.outputs.slot }}
            DATE (IST) = ${{ steps.s.outputs.date }}
            Use DATE-SLOT = ${{ steps.s.outputs.date }}-${{ steps.s.outputs.slot }} for all file names.
          claude_args: |
            --max-turns 90
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

      - name: First attempt made the post?
        id: first
        if: steps.s.outputs.skip == 'no'
        continue-on-error: true
        run: |
          F="queue/${{ steps.s.outputs.date }}-${{ steps.s.outputs.slot }}"
          test -f "$F.json" && test -f "$F.png" && test -f "$F-fb.jpg"

      - name: Claude was unavailable - waiting 10 minutes before trying again
        if: steps.s.outputs.skip == 'no' && steps.first.outcome == 'failure'
        run: sleep 600

      - name: Claude second attempt (first one stopped early)
        id: a2
        continue-on-error: true
        if: steps.s.outputs.skip == 'no' && steps.first.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "*"   # runs started by the watchdog / timers are bot-started; without this Claude is rejected and the slot is missed
          prompt: |
            Read PROMPT.md in the repository root and follow it exactly.
            SLOT = ${{ steps.s.outputs.slot }}
            DATE (IST) = ${{ steps.s.outputs.date }}
            Use DATE-SLOT = ${{ steps.s.outputs.date }}-${{ steps.s.outputs.slot }} for all file names.
          claude_args: |
            --max-turns 90
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

      - name: Second attempt made the post?
        id: second
        if: steps.s.outputs.skip == 'no' && steps.first.outcome == 'failure'
        continue-on-error: true
        run: |
          F="queue/${{ steps.s.outputs.date }}-${{ steps.s.outputs.slot }}"
          test -f "$F.json" && test -f "$F.png" && test -f "$F-fb.jpg"

      - name: Claude was unavailable - waiting 20 minutes before the last try
        if: steps.s.outputs.skip == 'no' && steps.second.outcome == 'failure'
        run: sleep 1200

      - name: Claude third attempt
        id: a3
        continue-on-error: true
        if: steps.s.outputs.skip == 'no' && steps.second.outcome == 'failure'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "*"   # runs started by the watchdog / timers are bot-started; without this Claude is rejected and the slot is missed
          prompt: |
            Read PROMPT.md in the repository root and follow it exactly.
            SLOT = ${{ steps.s.outputs.slot }}
            DATE (IST) = ${{ steps.s.outputs.date }}
            Use DATE-SLOT = ${{ steps.s.outputs.date }}-${{ steps.s.outputs.slot }} for all file names.
          claude_args: |
            --max-turns 90
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

      - name: Claude could not make the post - use a reserve post instead
        if: steps.s.outputs.skip == 'no' && steps.s.outputs.dry == 'false'
        run: |
          F="queue/${{ steps.s.outputs.date }}-${{ steps.s.outputs.slot }}"
          if ! { test -f "$F.json" && test -f "$F.png" && test -f "$F-fb.jpg"; }; then
            echo "::warning::Claude was unavailable after 3 attempts - publishing a reserve post so the slot is not missed"
            python3 reserve/fallback.py "${{ steps.s.outputs.date }}" "${{ steps.s.outputs.slot }}"
          fi

      - name: Check the post was made
        if: steps.s.outputs.skip == 'no'
        run: |
          F="queue/${{ steps.s.outputs.date }}-${{ steps.s.outputs.slot }}"
          ls -la queue
          test -f "$F.json" && test -f "$F.png" && test -f "$F-fb.jpg"
          python -c "import json;d=json.load(open('$F.json'));assert d['text'] and d['facebook']['caption'];print(d['text'])"
          if [ "${{ steps.s.outputs.slot }}" = "evening" ] && [ ! -f "$F-reel.json" ]; then echo "::warning::Evening reel was not made today"; fi

      - name: Dry run - keep as draft
        if: steps.s.outputs.skip == 'no' && steps.s.outputs.dry == 'true'
        run: |
          mkdir -p drafts
          mv queue/${{ steps.s.outputs.date }}-${{ steps.s.outputs.slot }}* drafts/

      - name: Publish to X + Facebook
        if: steps.s.outputs.skip == 'no' && steps.s.outputs.dry == 'false'
        env:
          X_CONSUMER_KEY: ${{ secrets.X_CONSUMER_KEY }}
          X_CONSUMER_SECRET: ${{ secrets.X_CONSUMER_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python poster.py

      - name: Save results
        if: always() && steps.s.outputs.skip == 'no'
        run: |
          git config user.name "smalik-poster-bot"
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"; git config --local --unset-all credential.helper 2>/dev/null || true
          git config user.email "actions@users.noreply.github.com"
          for d in queue posted failed drafts status reserve/used.json; do [ -e "$d" ] && git add -A "$d" || true; done
          git diff --cached --quiet || (git commit -m "Daily post ${{ steps.s.outputs.date }} ${{ steps.s.outputs.slot }}" && for i in 1 2 3 4; do git pull --rebase -q origin main && git push origin HEAD:main && break || sleep 7; done; git diff --quiet origin/main HEAD)
